name: build and publish

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) -- no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # pnpm publish uses the version in package.json and never looks at the
      # tag, so a mismatched tag silently publishes a different version (tag
      # 0.3.9 shipped as npm 0.4.0 this way). Fail before anything is built.
      - name: check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag '$TAG' does not match package.json version '$VERSION'"
            exit 1
          fi

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: run oxlint
        run: pnpm run lint

      - name: run tests
        run: pnpm run test

      - name: compile typescript
        run: pnpm run build

      - name: publish npm package
        run: pnpm publish --no-git-checks
