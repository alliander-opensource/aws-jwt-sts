---
# Dependabot version updates.
version: 2

updates:
  - package-ecosystem: github-actions
    # For github-actions this is always `/`; Dependabot scans
    # .github/workflows from there.
    directory: /
    schedule:
      interval: weekly
    # One pull request for all actions rather than one per action. There are
    # only four, and they are reviewed as a set anyway.
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 4
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
      production-dependencies:
        dependency-type: production
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope

    ignore:
      # Only the accidental, deprecated publish that still holds `latest`.
      # A genuine 3.x should raise a pull request.
      - dependency-name: aws-cdk
        versions:
          - 3.0.0
      # typescript 7 needs jsii 7 to exist. Minors are NOT ignored: jsii and
      # typescript land in the same grouped pull request, reviewed as a pair.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Bounded by the Lambda runtime (NODEJS_24_X); 26 adds node:quic/ffi/vfs.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
